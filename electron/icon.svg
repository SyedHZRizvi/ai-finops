<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="aifoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="boltShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: rounded-square with brand gradient (matches extension icon vibe). -->
  <rect x="8" y="8" width="240" height="240" rx="56" ry="56" fill="url(#aifoBg)"/>

  <!-- Lightning bolt mark in white. Coordinates roughly mirror the extension icon proportions, scaled up to 256. -->
  <path
    d="M141.5 32 L66.5 142 H110 L92 224 L172 110 H128 L141.5 32 Z"
    fill="#ffffff"
    stroke="rgba(0,0,0,0.18)"
    stroke-width="3"
    stroke-linejoin="round"
    filter="url(#boltShadow)"
  />
</svg>
