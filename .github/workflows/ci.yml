name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Type check (Electron)
        run: npx tsc -p electron

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Build SDK
        run: |
          cd sdk
          npm install
          npm run build
